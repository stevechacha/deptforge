<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tech Career System — Find Your Way In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1B2E;
  --bg-elevated:#12213A;
  --surface:#182B49;
  --surface-hi:#1F3556;
  --border:#2A4166;
  --border-soft:#213655;
  --copper:#C98A2E;
  --copper-bright:#E8A33D;
  --teal:#4FA382;
  --teal-bright:#63C29B;
  --text:#EDE7DA;
  --text-muted:#9BAAC2;
  --text-dim:#5D7292;
  --danger:#C9622E;
  --radius:2px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size:64px 64px;
  background-attachment:fixed;
  color:var(--text);
  font-family:'Source Serif 4', serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--copper); color:var(--bg);}

/* ---------- layout shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
header.top{
  position:sticky; top:0; z-index:50;
  background:rgba(14,27,46,0.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; max-width:1180px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
.brand-mark{width:26px; height:26px; flex:none;}
.brand-text{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.02em;}
.brand-text span{color:var(--copper-bright);}
.nav-links{display:flex; gap:26px; align-items:center;}
.nav-links a{
  font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em;
  color:var(--text-muted); text-decoration:none; cursor:pointer; transition:color .15s;
}
.nav-links a:hover{color:var(--copper-bright);}
.search-mini{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); padding:7px 12px; border-radius:var(--radius);}
.search-mini input{background:none; border:none; outline:none; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:12px; width:150px;}
.search-mini input::placeholder{color:var(--text-dim);}

main{min-height:70vh;}
footer{border-top:1px solid var(--border); padding:32px 0 48px; margin-top:80px;}
footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
footer p{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin:0; letter-spacing:0.03em;}

/* ---------- hero ---------- */
.hero{padding:76px 0 40px; position:relative;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--teal-bright); display:flex; align-items:center; gap:10px; margin-bottom:22px;
}
.eyebrow::before{content:''; width:22px; height:1px; background:var(--teal-bright); display:inline-block;}
.hero h1{font-size:clamp(34px,5.6vw,58px); font-weight:600; line-height:1.05; margin:0 0 22px; max-width:820px;}
.hero h1 em{font-style:normal; color:var(--copper-bright);}
.hero p.lede{font-family:'Source Serif 4',serif; font-size:18px; color:var(--text-muted); max-width:620px; margin:0 0 34px;}
.hero-actions{display:flex; gap:14px; flex-wrap:wrap;}
.btn{
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
  padding:13px 22px; border-radius:var(--radius); border:1px solid var(--copper); background:var(--copper);
  color:var(--bg); font-weight:600; transition:all .15s; display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{background:var(--copper-bright); border-color:var(--copper-bright);}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--border);}
.btn.ghost:hover{border-color:var(--text-muted); color:var(--copper-bright);}

/* ---------- circuit map (signature element) ---------- */
.map-shell{margin:56px 0 20px; border:1px solid var(--border); background:var(--bg-elevated); border-radius:var(--radius); position:relative; overflow:hidden;}
.map-shell .map-label{
  position:absolute; top:16px; left:20px; font-family:'IBM Plex Mono',monospace; font-size:11px;
  color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; z-index:2;
}
svg.circuit{display:block; width:100%; height:auto;}
.node-hub circle.ring{fill:none; stroke-width:1; opacity:0.5;}
.node-hub{cursor:pointer;}
.node-hub .core-shape{transition:filter .2s;}
.node-hub:hover .core-shape{filter:brightness(1.25);}
.node-hub text.node-title{font-family:'Space Grotesk',sans-serif; font-weight:600; pointer-events:none;}
.node-hub text.node-sub{font-family:'IBM Plex Mono',monospace; pointer-events:none;}
.wire{fill:none; stroke:var(--border); stroke-width:1.4;}
.wire.active{stroke:var(--copper); stroke-width:1.6;}
.pulse{fill:var(--copper-bright); filter:drop-shadow(0 0 3px var(--copper-bright));}

/* ---------- sections ---------- */
.section{padding:64px 0;}
.section-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px; flex-wrap:wrap; gap:14px;}
.section-head h2{font-size:26px; margin:0; font-weight:600;}
.section-head p{color:var(--text-muted); margin:6px 0 0; font-size:15px; max-width:520px;}
.tag-num{font-family:'IBM Plex Mono',monospace; color:var(--text-dim); font-size:12px;}

.dept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border);}
.dept-card{background:var(--bg-elevated); padding:26px 24px; cursor:pointer; transition:background .15s; position:relative;}
.dept-card:hover{background:var(--surface);}
.dept-card .dept-index{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-bottom:14px; display:block;}
.dept-card h3{font-size:18px; margin:0 0 10px; font-weight:600;}
.dept-card p{color:var(--text-muted); font-size:13.5px; margin:0 0 16px; min-height:56px;}
.dept-card .role-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--copper-bright); text-transform:uppercase; letter-spacing:0.06em;}
.dept-card .arrow{position:absolute; right:22px; top:24px; color:var(--text-dim); font-size:16px; transition:transform .15s, color .15s;}
.dept-card:hover .arrow{transform:translateX(4px); color:var(--copper-bright);}

/* ---------- department detail view ---------- */
.crumbs{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-bottom:20px; letter-spacing:0.04em;}
.crumbs a{color:var(--text-muted); text-decoration:none; cursor:pointer;}
.crumbs a:hover{color:var(--copper-bright);}
.dept-header{border-bottom:1px solid var(--border); padding-bottom:32px; margin-bottom:36px;}
.dept-header .dept-icon-row{display:flex; align-items:center; gap:16px; margin-bottom:16px;}
.dept-icon-badge{width:44px; height:44px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--copper-bright); flex:none;}
.dept-header h1{font-size:32px; margin:0; font-weight:600;}
.dept-header .purpose{font-size:17px; color:var(--text-muted); max-width:680px; margin:14px 0 0;}
.func-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px;}
.func-chip{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal-bright); border:1px solid rgba(79,163,130,0.35); background:rgba(79,163,130,0.08); padding:6px 11px; border-radius:20px;}

.role-list{display:flex; flex-direction:column; border-top:1px solid var(--border);}
.role-row{
  display:flex; align-items:center; justify-content:space-between; padding:22px 4px;
  border-bottom:1px solid var(--border); cursor:pointer; transition:padding-left .15s, background .15s;
}
.role-row:hover{background:var(--bg-elevated); padding-left:14px;}
.role-row-left{display:flex; align-items:baseline; gap:18px;}
.role-row .rnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); width:26px;}
.role-row h4{margin:0; font-size:18px; font-weight:600; font-family:'Space Grotesk',sans-serif;}
.role-row .rtag{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-left:14px;}
.role-row .rarrow{color:var(--text-dim); font-size:16px;}
.role-row:hover .rarrow{color:var(--copper-bright);}

/* ---------- role detail view ---------- */
.role-header{margin-bottom:8px;}
.role-header .dept-of{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal-bright); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:14px; display:block;}
.role-header h1{font-size:36px; margin:0 0 14px; font-weight:600; max-width:760px;}
.role-header .role-blurb{font-size:17px; color:var(--text-muted); max-width:680px; margin:0;}

.role-grid{display:grid; grid-template-columns:2fr 1fr; gap:48px; margin-top:44px; align-items:start;}
@media (max-width:860px){.role-grid{grid-template-columns:1fr;}}

.block{margin-bottom:44px;}
.block h3{font-size:13px; text-transform:uppercase; letter-spacing:0.1em; font-family:'IBM Plex Mono',monospace; color:var(--copper-bright); margin:0 0 18px; display:flex; align-items:center; gap:10px;}
.block h3::after{content:''; flex:1; height:1px; background:var(--border);}
.block .block-sub{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); margin:-10px 0 18px;}

.module{border:1px solid var(--border); background:var(--bg-elevated); margin-bottom:1px;}
.module-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; gap:12px; flex-wrap:wrap;}
.module-head .m-left{display:flex; align-items:center; gap:14px;}
.module-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bg); background:var(--copper); width:24px; height:24px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex:none;}
.module-head h4{margin:0; font-size:15.5px; font-family:'Space Grotesk',sans-serif; font-weight:600;}
.module-meta{display:flex; align-items:center; gap:8px; flex:none;}
.module-level{font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 9px; border:1px solid rgba(79,163,130,0.4); border-radius:20px; color:var(--teal-bright); text-transform:uppercase; letter-spacing:0.05em; white-space:nowrap;}
.module-dur{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}
.module-topics{list-style:none; margin:0; padding:0 20px 18px 58px; color:var(--text-muted); font-size:14px;}
.module-topics li{position:relative; padding:3px 0;}
.module-topics li::before{content:'—'; position:absolute; left:-18px; color:var(--text-dim);}

.side-box{border:1px solid var(--border); background:var(--bg-elevated); padding:22px; margin-bottom:22px;}
.side-box h4{margin:0 0 14px; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);}
.side-box ul{margin:0; padding:0 0 0 16px; font-size:13.5px; color:var(--text); line-height:1.7;}
.side-box ul.plain{padding:0; list-style:none;}
.side-box ul.plain li{padding:4px 0 4px 16px; position:relative;}
.side-box ul.plain li::before{content:'▸'; position:absolute; left:0; color:var(--copper-bright); font-size:11px;}
.tool-chip-row{display:flex; flex-wrap:wrap; gap:7px;}
.tool-chip{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 10px; border:1px solid var(--border); color:var(--text-muted); border-radius:2px;}

.connects-box{border:1px solid var(--border); padding:22px;}
.connects-box h4{margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-family:'IBM Plex Mono',monospace; color:var(--text-muted);}
.connects-box p.note{font-size:12.5px; color:var(--text-dim); margin:0 0 14px;}
.connect-link{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--border-soft); cursor:pointer; transition:color .15s;}
.connect-link:first-of-type{border-top:none;}
.connect-link:hover{color:var(--copper-bright);}
.connect-link .clabel{font-size:13.5px;}
.connect-link .cdept{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim);}

/* ---------- search results ---------- */
.results-list{display:flex; flex-direction:column; gap:1px; background:var(--border); border:1px solid var(--border);}
.result-item{background:var(--bg-elevated); padding:18px 20px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:16px;}
.result-item:hover{background:var(--surface);}
.result-item .rname{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
.result-item .rdept{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:4px;}
.empty-note{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:20px 0;}

/* ---------- misc ---------- */
.pathway-strip{border:1px solid var(--border); background:var(--bg-elevated); padding:28px 30px; margin-top:56px; display:flex; align-items:center; gap:24px; flex-wrap:wrap; justify-content:space-between;}
.pathway-strip p{margin:0; font-size:15px; color:var(--text-muted); max-width:520px;}
.pathway-strip strong{color:var(--text); font-family:'Space Grotesk',sans-serif;}

@media (max-width:640px){
  .topbar{flex-direction:column; gap:14px; align-items:flex-start;}
  .nav-links{gap:16px; flex-wrap:wrap;}
  .role-row-left{flex-direction:column; gap:4px; align-items:flex-start;}
}
</style>
</head>

/* =========================================================
   CIRCUIT MAP (SVG)
========================================================= */
function renderCircuitMap(){
  const cx=590, cy=260, R=190;
  const n = DEPARTMENTS.length;
  const angles = DEPARTMENTS.map((_,i)=> -90 + i*(360/n));
  const hubs = DEPARTMENTS.map((d,i)=>{
    const a = angles[i]*Math.PI/180;
    return { d, x: cx + R*Math.cos(a), y: cy + R*Math.sin(a) };
  });
  let wires='';
  hubs.forEach(h=>{
    wires += `<path class="wire" d="M${cx},${cy} L${h.x},${h.y}"></path>`;
  });
  // a few cross-links to show system connections
  const crossPairs = [];
  for(let i=0;i<n;i++){ crossPairs.push([i,(i+2)%n]); }
  crossPairs.forEach(([i,j])=>{
    const a=hubs[i], b=hubs[j];
    const mx=(a.x+b.x)/2 + (cy-((a.y+b.y)/2))*0.06, my=(a.y+b.y)/2 + (cx-((a.x+b.x)/2))*-0.06;
    wires += `<path class="wire" style="opacity:0.35" d="M${a.x},${a.y} Q${mx},${my} ${b.x},${b.y}"></path>`;
  });

  let nodes = `<g class="node-hub" onclick="navigate('depts')">
      <rect class="core-shape" x="${cx-46}" y="${cy-46}" width="92" height="92" fill="#0E1B2E" stroke="#E8A33D" stroke-width="1.6" transform="rotate(45 ${cx} ${cy})"/>
      <circle class="core-shape" cx="${cx}" cy="${cy}" r="30" fill="#182B49" stroke="#E8A33D" stroke-width="1.2"/>
      <text x="${cx}" y="${cy-3}" text-anchor="middle" class="node-title" font-size="11" fill="#EDE7DA">TECH</text>
      <text x="${cx}" y="${cy+13}" text-anchor="middle" class="node-sub" font-size="9" fill="#E8A33D">CAREER CORE</text>
    </g>`;

  hubs.forEach(h=>{
    nodes += `<g class="node-hub" onclick="navigate('dept','${h.d.id}')">
      <circle class="ring" cx="${h.x}" cy="${h.y}" r="46" stroke="${h.d.color}"></circle>
      <circle class="core-shape" cx="${h.x}" cy="${h.y}" r="34" fill="#182B49" stroke="${h.d.color}" stroke-width="1.4"/>
      <text x="${h.x}" y="${h.y-2}" text-anchor="middle" class="node-title" font-size="12" fill="#EDE7DA">${h.d.icon}</text>
      <text x="${h.x}" y="${h.y+13}" text-anchor="middle" class="node-sub" font-size="8.5" fill="${h.d.color}">${h.d.roles.length} ROLES</text>
    </g>
    <text x="${h.x}" y="${h.y + 62}" text-anchor="middle" class="node-sub" font-size="10.5" fill="#9BAAC2" font-family="Space Grotesk, sans-serif" font-weight="600">${wrapLabel(h.d.name)}</text>`;
  });

  return `<div class="map-shell">
    <span class="map-label">System Map — click a node to explore</span>
    <svg class="circuit" viewBox="0 0 1180 520" xmlns="http://www.w3.org/2000/svg">
      ${wires}
      ${nodes}
    </svg>
  </div>`;
}
function wrapLabel(name){
  // split long dept names onto two tspans for legibility
  const words = name.split(' ');
  if(words.join(' ').length < 16) return escapeHtml(name);
  const mid = Math.ceil(words.length/2);
  const l1 = words.slice(0,mid).join(' '), l2 = words.slice(mid).join(' ');
  return `<tspan x="${'inherit'}">${escapeHtml(l1)}</tspan>`; // fallback single line (kept simple for SVG text)
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function viewSearch(query){
  const q = query.trim().toLowerCase();
  let results = [];
  if(q.length){
    Object.values(ROLE_INDEX).forEach(r=>{
      const haystack = [r.name, r.deptName, r.tag, ...(r.skills||[]), ...(r.tools||[])].join(' ').toLowerCase();
      if(haystack.includes(q)) results.push(r);
    });
  }
  return `
  <div class="wrap section">
    <div class="crumbs"><a onclick="navigate('home')">Map</a> / Search</div>
    <div class="section-head">
      <div><h2>Search results for "${escapeHtml(query)}"</h2><p>${results.length} role${results.length===1?'':'s'} matched</p></div>
    </div>
    ${results.length ? `<div class="results-list">${results.map(r=>`
      <div class="result-item" onclick="navigate('role','${r.id}')">
        <div>
          <div class="rname">${r.name}</div>
          <div class="rdept">${r.deptName}</div>
        </div>
        <span class="rarrow">→</span>
      </div>
    `).join('')}</div>` : `<p class="empty-note">No roles match that search — try a broader term like "cloud", "security", "mobile", or "AI".</p>`}
  </div>`;
}

/* =========================================================
   ROUTER
========================================================= */
function navigate(view, id){
  document.getElementById('searchInput').value='';
  let html='';
  if(view==='home') html = viewHome();
  else if(view==='depts') html = viewDepts();
  else if(view==='dept') html = viewDept(id);
  else if(view==='role') html = viewRole(id);
  else html = viewNotFound();
  document.getElementById('app').innerHTML = html;
  window.scrollTo({top:0, behavior:'instant'});
  history.replaceState(null,'', view==='home' ? '#' : `#${view}${id?'/'+id:''}`);
}

let searchDebounce;
function handleSearch(value){
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{
    if(!value.trim()){ return; }
    document.getElementById('app').innerHTML = viewSearch(value);
    window.scrollTo({top:0, behavior:'instant'});
  }, 220);
}
document.getElementById('searchInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ document.getElementById('app').innerHTML = viewSearch(e.target.value); window.scrollTo({top:0}); }
});

/* initial route */
(function init(){
  const hash = location.hash.replace('#','');
  if(!hash){ navigate('home'); return; }
  const [view, id] = hash.split('/');
  navigate(view, id);
})();
</script>
